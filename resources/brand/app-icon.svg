<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B0F86"/>
      <stop offset="0.55" stop-color="#2A1B8F"/>
      <stop offset="1" stop-color="#0D60A6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="0.7" stop-color="#FFB12B"/>
      <stop offset="1" stop-color="#F7931E"/>
    </radialGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <clipPath id="mark">
      <polygon points="0,0 132,0 132,132"/>
      <polygon points="132,0 264,0 264,132"/>
      <polygon points="0,132 132,132 132,264"/>
      <polygon points="132,132 264,132 264,264"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
  <!-- Sun -->
  <g transform="translate(384 132)">
    <circle r="78" fill="#FFB12B" opacity="0.35" filter="url(#glow)"/>
    <g fill="#F7931E">
      <polygon points="0,-98 9,-70 -9,-70"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(30)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(60)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(90)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(120)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(150)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(180)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(210)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(240)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(270)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(300)"/>
      <polygon points="0,-98 9,-70 -9,-70" transform="rotate(330)"/>
    </g>
    <circle r="60" fill="url(#sun)"/>
  </g>
  <!-- Digital Target mark rendered as solar cells -->
  <g transform="translate(88 176)">
    <g clip-path="url(#mark)">
      <rect width="264" height="264" fill="url(#cell)"/>
      <g stroke="#2A4FB0" stroke-opacity="0.55" stroke-width="5">
        <line x1="44" y1="0" x2="44" y2="264"/>
        <line x1="88" y1="0" x2="88" y2="264"/>
        <line x1="176" y1="0" x2="176" y2="264"/>
        <line x1="220" y1="0" x2="220" y2="264"/>
        <line x1="0" y1="44" x2="264" y2="44"/>
        <line x1="0" y1="88" x2="264" y2="88"/>
        <line x1="0" y1="176" x2="264" y2="176"/>
        <line x1="0" y1="220" x2="264" y2="220"/>
      </g>
    </g>
  </g>
  <!-- small green energy accent (nod to WETCO) -->
  <circle cx="404" cy="404" r="0" fill="#8BF00A"/>
</svg>
